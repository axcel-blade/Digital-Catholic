name: PR base branch

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  require-contribution-base:
    name: Require contribution as PR base
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && github.head_ref != 'contribution'
    steps:
      - name: Reject pull requests targeting main
        run: |
          echo "::error::Open pull requests against the \`contribution\` branch, not \`main\`."
          echo "Branch from \`contribution\`, push your changes, and open a PR into \`contribution\`."
          echo "Maintainers merge \`contribution\` → \`main\` when ready to deploy."
          exit 1
